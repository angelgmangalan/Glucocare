services:
  - type: web
    name: glucocare-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GLUCOCARE_CORS_ORIGINS
        value: https://your-glucocare.vercel.app
